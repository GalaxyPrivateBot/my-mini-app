<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P.R.C. BD | 账号系统</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --main-bg: #030712;
      --card-bg: #111827;
      --accent-blue: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success-green: #10b981;
      --error-red: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border-color: #1f2937;
    }

    body {
      margin: 0;
      background-color: var(--main-bg);
      color: var(--text-main);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🌊 Refresh Wave Effect */
    #blur-layer {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(0px);
      z-index: 2000;
      pointer-events: none;
      transition: all 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wave { width: 0%; height: 0%; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%); border-radius: 50%; transition: 0.6s; }

    .container { width: 100%; max-width: 450px; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 {
      font-size: 24px;
      background: linear-gradient(to right, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hidden Class for UI Swapping */
    .hidden { display: none; opacity: 0; transform: translateY(20px); }

    .field-group { margin-bottom: 20px; }
    .field-group label {
      display: block; font-size: 13px; color: var(--text-dim);
      margin-bottom: 8px; margin-left: 5px;
    }

    input, textarea {
      width: 100%; background: #000; border: 2px solid var(--border-color);
      border-radius: 16px; padding: 14px; color: #fff; outline: none;
      box-sizing: border-box; transition: 0.3s;
    }
    input:focus { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-glow); }

    .btn {
      width: 100%; padding: 16px; border-radius: 16px; border: none;
      font-size: 16px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.2s; margin-top: 10px;
    }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .btn-secondary { background: transparent; border: 2px solid var(--accent-blue); color: var(--accent-blue); }
    .btn:active { transform: scale(0.96); }

    .status-area {
      margin-top: 15px; padding: 12px; border-radius: 12px;
      font-size: 13px; text-align: center; display: none;
    }
    .success { background: rgba(16, 185, 129, 0.1); color: var(--success-green); border: 1px solid var(--success-green); }
    .error { background: rgba(244, 63, 94, 0.1); color: var(--error-red); border: 1px solid var(--error-red); }

    .output-preview {
      margin-top: 15px; font-family: monospace; font-size: 11px;
      background: #000; padding: 12px; border-radius: 12px;
      color: #60a5fa; word-break: break-all; display: none;
    }

    .fan-trigger {
      position: fixed; right: 20px; bottom: 30px;
      width: 55px; height: 55px; background: #3b82f6;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow); cursor: pointer; z-index: 2001;
    }
    .rotate-anim { animation: fanRotate 0.6s linear; }
    @keyframes fanRotate { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="blur-layer"><div class="wave" id="wave"></div></div>

  <div class="container">
    <div class="header">
      <h1 id="mainTitle">系统登录</h1>
    </div>

    <div id="loginCard" class="card">
      <div class="field-group">
        <label><i class="fas fa-user-shield"></i> 管理员账号</label>
        <input type="text" id="adminUser" placeholder="Enter Admin Username">
      </div>
      <div class="field-group">
        <label><i class="fas fa-key"></i> 访问令牌 (Password)</label>
        <input type="password" id="adminPass" placeholder="Enter Password">
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> 验证并进入
      </button>
      <div id="loginStatus" class="status-area"></div>
    </div>

    <div id="mainContent" class="card hidden">
      <div class="field-group">
        <label>用户名 (Username)</label>
        <input type="text" id="user" placeholder="请输入用户名">
      </div>
      <div class="field-group">
        <label>登录密码 (Password)</label>
        <input type="password" id="pass" placeholder="请输入密码">
      </div>
      <div class="field-group">
        <label>Cookie 数据</label>
        <textarea id="cookie" rows="4" placeholder="在此粘贴完整的 Cookie 内容"></textarea>
      </div>
      <div class="btn-stack">
        <button class="btn btn-primary" onclick="processConversion()">
          <i class="fas fa-exchange-alt"></i> 立即开始转换
        </button>
        <button class="btn btn-secondary" onclick="processPush()">
          <i class="fas fa-rocket"></i> 将数据推送到服务器
        </button>
      </div>
      <div id="statusBox" class="status-area"></div>
      <div id="resultPreview" class="output-preview"></div>
    </div>
  </div>

  <div class="fan-trigger" id="fan" onclick="runRefresh()">
    <i class="fas fa-fan"></i>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🔑 লগইন কনফিগারেশন (আপনার এডমিন প্যানেলের সাথে মিলিয়ে নিন)
    const AUTH_CONFIG = {
      user: "admin", // এখানে আপনার ইউজারনেম দিন
      pass: "1234"   // এখানে আপনার পাসওয়ার্ড দিন
    };

    function handleLogin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const loginStatus = document.getElementById('loginStatus');

      if (u === AUTH_CONFIG.user && p === AUTH_CONFIG.pass) {
        showSuccess('登录成功，正在加载...', loginStatus);
        
        // এনিমেশনের মাধ্যমে মেইন ইন্টারফেস শো করা
        setTimeout(() => {
          document.getElementById('loginCard').classList.add('hidden');
          document.getElementById('loginCard').style.display = 'none';
          
          const mainContent = document.getElementById('mainContent');
          mainContent.classList.remove('hidden');
          mainContent.style.display = 'block';
          document.getElementById('mainTitle').innerText = "账号格式转换系统";
        }, 800);
      } else {
        showError('身份验证失败：请检查账号或密码', loginStatus);
      }
    }

    // --- আগের মেইন লজিকগুলো ---

    function processConversion() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value.trim();
      const c = document.getElementById('cookie').value.trim();
      const status = document.getElementById('statusBox');
      const preview = document.getElementById('resultPreview');

      if (!u || !p || !c || !c.includes('=')) {
        showError('❌ 验证失败：请填写完整信息', status);
        preview.style.display = 'none';
        return;
      }

      const finalString = `${u}:${p}|||${c}||`;
      window.savedData = finalString;
      preview.textContent = finalString;
      preview.style.display = 'block';
      showSuccess('✅ 转换成功：数据已就绪', status);
    }

    async function processPush() {
      if (!window.savedData) {
        showError('⚠️ 错误：请先完成格式转换', document.getElementById('statusBox'));
        return;
      }
      // ... আপনার আগের Fetch API লজিক এখানে থাকবে ...
      showSuccess('🚀 数据推送逻辑已启动', document.getElementById('statusBox'));
    }

    function runRefresh() {
      const fan = document.getElementById('fan');
      fan.classList.add('rotate-anim');
      setTimeout(() => {
        location.reload(); // সম্পূর্ণ রিফ্রেশ করে আবার লগইন পেজে পাঠাবে
      }, 600);
    }

    function showSuccess(msg, element) {
      element.style.display = 'block';
      element.className = 'status-area success';
      element.innerHTML = msg;
    }

    function showError(msg, element) {
      element.style.display = 'block';
      element.className = 'status-area error';
      element.innerHTML = msg;
    }
  </script>
</body>
</html>
